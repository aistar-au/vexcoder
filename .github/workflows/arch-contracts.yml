name: Architecture Contracts

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: arch-contracts-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  arch-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        env:
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          AUTH="$(printf 'x-access-token:%s' "$TOKEN" | base64 | tr -d '\n')"
          git init .
          git remote add origin "https://github.com/${REPO}.git"
          git -c http.extraheader="AUTHORIZATION: basic ${AUTH}" fetch --depth=1 origin "$SHA"
          git checkout --detach FETCH_HEAD

      - name: Install Rust
        run: |
          set -euo pipefail
          source "$HOME/.cargo/env" 2>/dev/null || true
          rustup toolchain install 1.93.1 --profile minimal
          rustup default 1.93.1

      - name: Ensure ripgrep is available
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          if command -v rg >/dev/null 2>&1; then
            rg --version
            exit 0
          fi

          install_ripgrep() {
            timeout 5m sudo env DEBIAN_FRONTEND="$DEBIAN_FRONTEND" \
              apt-get update -o Acquire::Retries=3
            timeout 5m sudo env DEBIAN_FRONTEND="$DEBIAN_FRONTEND" \
              apt-get install -y --no-install-recommends \
              -o Acquire::Retries=3 \
              -o DPkg::Lock::Timeout=60 \
              ripgrep
          }

          for attempt in 1 2; do
            if install_ripgrep; then
              rg --version
              exit 0
            fi

            echo "ripgrep install attempt ${attempt} failed" >&2
            sleep 5
          done

          echo "failed to install ripgrep for architecture checks" >&2
          exit 1

      - name: Run architecture gate targets
        run: |
          make check-arch
          make check-disk-policy
          make test-targets
