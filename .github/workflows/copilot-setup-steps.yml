name: Copilot Setup Steps

on:
  workflow_dispatch:
  push:
    paths:
      - AGENTS.md
      - CONTRIBUTING.md
      - .github/copilot-instructions.md
      - .github/agents/**
      - .github/instructions/**
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - AGENTS.md
      - CONTRIBUTING.md
      - .github/copilot-instructions.md
      - .github/agents/**
      - .github/instructions/**
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Verify hosted background sessions stay self-contained
        shell: bash
        run: |
          set -euo pipefail

          show_matches() {
            local pattern="$1"
            shift
            if command -v rg >/dev/null 2>&1; then
              rg -n -- "$pattern" "$@"
            else
              grep -nE -- "$pattern" "$@"
            fi
          }

          hosted_files=(
            .github/copilot-instructions.md
            .github/agents/rust-change-auditor.agent.md
            .github/agents/vexcoder-ui-parity-orchestrator.agent.md
            .github/agents/vexcoder-ui-paragraph-renderer.agent.md
            .github/agents/vexcoder-transcript-renderer-overhaul.agent.md
          )

          if show_matches "../vexdraft/.agents/skills/|aistar-au/vexdraft|synchronized skill tree|GitHub MCP|Bootstrap private skills" "${hosted_files[@]}"; then
            echo "Hosted-session contract still references private skill bootstrap."
            exit 1
          fi

          echo "Hosted background sessions are self-contained and do not require private skill bootstrap."

      - name: Verify hosted-session guardrails stay explicit
        shell: bash
        run: |
          set -euo pipefail

          has_match() {
            local pattern="$1"
            shift
            if command -v rg >/dev/null 2>&1; then
              rg -qi -- "$pattern" "$@"
            else
              grep -qiE -- "$pattern" "$@"
            fi
          }

          show_matches() {
            local pattern="$1"
            shift
            if command -v rg >/dev/null 2>&1; then
              rg -n -- "$pattern" "$@"
            else
              grep -nE -- "$pattern" "$@"
            fi
          }

          contract_files=(
            AGENTS.md
            CONTRIBUTING.md
            .github/copilot-instructions.md
            .github/instructions/repository.instructions.md
            .github/agents/rust-change-auditor.agent.md
            .github/agents/vexcoder-ui-parity-orchestrator.agent.md
            .github/agents/vexcoder-ui-paragraph-renderer.agent.md
            .github/agents/vexcoder-transcript-renderer-overhaul.agent.md
          )

          for file in "${contract_files[@]}"; do
            has_match "self-contained|Do not bootstrap" "$file" || {
              echo "Missing self-contained/no-bootstrap guardrail in $file"
              exit 1
            }
            has_match "private skills|private .*skill tree" "$file" || {
              echo "Missing private-skill guardrail in $file"
              exit 1
            }
            has_match "[Uu]se English only" "$file" || {
              echo "Missing English-only guardrail in $file"
              exit 1
            }
            has_match 'Do not read any `SKILL.md` file' "$file" || {
              echo "Missing no-SKILL guardrail in $file"
              exit 1
            }
            has_match "text-only verification and reporting" "$file" || {
              echo "Missing text-only verification guardrail in $file"
              exit 1
            }
            has_match "screenshots, screen|pseudo-screenshots|parsed terminal snapshots|visual-surrogate" "$file" || {
              echo "Missing no-visual-artifact guardrail in $file"
              exit 1
            }
            has_match "gh agent-task view <session-id> --log --follow" "$file" || {
              echo "Missing mandatory session log tail command in $file"
              exit 1
            }
          done

          if show_matches '^[[:space:]]+--follow[[:space:]]*\\?$' CONTRIBUTING.md; then
            echo "Hosted launch examples must use explicit gh agent-task view --log --follow instead of gh agent-task create --follow."
            exit 1
          fi

      - name: Show hosted-session contract files
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' \
            AGENTS.md \
            CONTRIBUTING.md \
            .github/copilot-instructions.md \
            .github/agents/rust-change-auditor.agent.md \
            .github/instructions/repository.instructions.md \
            .github/agents/vexcoder-ui-parity-orchestrator.agent.md \
            .github/agents/vexcoder-ui-paragraph-renderer.agent.md \
            .github/agents/vexcoder-transcript-renderer-overhaul.agent.md
