name: release

on:
  push:
    tags:
      - "v*"
      - "nightly"
      # 7-char hex pattern for short-SHA snapshot tags.
      # GitHub Actions does not support the '?' glob, so we spell out
      # each hex character class explicitly.
      - "[0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # Signing phases:
  #   Phase 1 (now): Sigstore cosign keyless signatures with OIDC-backed bundles.
  #   Phase 2 (future): SignPath.io OSS Authenticode signing for Windows artifacts.
  #   Phase 3 (future): EV Authenticode signing for end-user Windows distribution.
  build:
    name: package (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
            build_tool: cross
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04
            build_tool: cross
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            build_tool: cargo
          - target: x86_64-pc-windows-gnu
            runner: ubuntu-24.04
            build_tool: cross
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            build_tool: cargo
          - target: aarch64-apple-darwin
            runner: macos-15
            build_tool: cargo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.build_tool == 'cross'
        shell: bash
        run: cargo install cross --locked

      - name: Install ripgrep and zip (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep zip

      - name: Install ripgrep (macOS)
        if: runner.os == 'macOS'
        run: brew install ripgrep

      - name: Install Taplo (non-Windows)
        if: runner.os != 'Windows'
        shell: bash
        run: cargo install taplo-cli --version 0.8.1 --locked

      - name: Install cargo-nextest (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: cargo install cargo-nextest --version 0.9.132 --locked

      - name: Install cargo-nextest (macOS prebuilt)
        if: runner.os == 'macOS'
        shell: bash
        env:
          NEXTEST_VERSION: 0.9.132
        run: |
          set -euo pipefail
          bin_dir="${CARGO_HOME:-$HOME/.cargo}/bin"
          mkdir -p "${bin_dir}"
          curl -LsSf "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-${NEXTEST_VERSION}/cargo-nextest-${NEXTEST_VERSION}-universal-apple-darwin.tar.gz" \
            | tar -xzf - -C "${bin_dir}" cargo-nextest
          chmod +x "${bin_dir}/cargo-nextest"

      - name: Verify release tag
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          set -euo pipefail
          tag_name="${GITHUB_REF_NAME}"

          if [[ "${tag_name}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            # Semver tag — must match Cargo.toml.
            pkgid="$(cargo pkgid --quiet)"
            pkg_fragment="${pkgid##*#}"
            expected_tag="v${pkg_fragment##*@}"
            if [[ "${tag_name}" != "${expected_tag}" ]]; then
              echo "FAIL: semver tag ${tag_name} does not match Cargo package version ${expected_tag}" >&2
              exit 1
            fi
          elif [[ "${tag_name}" =~ ^[0-9a-f]{7}$ ]]; then
            # Short-SHA tag — must match the first 7 characters of the checked-out commit.
            short_sha="$(git rev-parse HEAD)"; short_sha="${short_sha:0:7}"
            if [[ "${tag_name}" != "${short_sha}" ]]; then
              echo "FAIL: short-SHA tag ${tag_name} does not match HEAD ${short_sha}" >&2
              exit 1
            fi
          elif [[ "${tag_name}" == "nightly" ]]; then
            echo "Verified channel git tag: ${tag_name}"
          else
            echo "FAIL: unsupported tag format: ${tag_name}" >&2
            exit 1
          fi

      - name: Run gate (non-Windows)
        if: runner.os != 'Windows'
        shell: bash
        run: make gate-fast

      - name: Package release archive (non-Windows)
        if: runner.os != 'Windows'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          OUT_DIR: dist
          BUILD_TOOL: ${{ matrix.build_tool }}
          VERSION: ${{ github.ref_name }}
        run: bash scripts/release.sh

      - name: Package release archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
          OUT_DIR: dist
        run: |
          .\scripts\release.ps1 -Version $env:GITHUB_REF_NAME -Target $env:TARGET -OutDir $env:OUT_DIR

      - name: Upload dist artifact
        uses: actions/upload-artifact@v6
        with:
          name: dist-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  # Phase H (PH-03): macOS app bundle, code signing, notarisation, and .dmg.
  # Runs on the Apple Silicon runner after the build job produces the
  # aarch64-apple-darwin artifact.  A separate x86_64 .dmg is produced for
  # Intel Macs.  Both run in parallel as separate matrix entries.
  macos-pkg:
    name: macOS package (${{ matrix.target }})
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-apple-darwin
            runner: macos-15-intel

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Download build artifact for ${{ matrix.target }}
        uses: actions/download-artifact@v8
        with:
          name: dist-${{ matrix.target }}
          path: dist-input

      - name: Extract vex binary
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          mkdir -p dist
          ARCHIVE="$(find dist-input -maxdepth 1 -name "vex-*-${TARGET}.tar.gz" -type f | head -1)"
          if [[ -z "${ARCHIVE}" ]]; then
            echo "FAIL: could not find release archive for ${TARGET} in dist-input" >&2
            find dist-input -maxdepth 2 -type f | sort >&2
            exit 1
          fi

          PACKAGE_DIR="$(basename "${ARCHIVE}" .tar.gz)"
          tar -xzf "${ARCHIVE}" -C dist

          # scripts/release.sh stages the binary under dist/<package-dir>/vex.
          VEX_BIN="dist/${PACKAGE_DIR}/vex"
          if [[ ! -f "${VEX_BIN}" ]]; then
            echo "FAIL: vex binary not found after extracting ${ARCHIVE}" >&2
            find dist -maxdepth 3 -type f | sort >&2
            exit 1
          fi

          echo "VEX_BIN=${VEX_BIN}" >> "$GITHUB_ENV"

      - name: Build vex-launcher
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --manifest-path packaging/macos/Cargo.toml
          echo "LAUNCHER_BIN=packaging/macos/target/release/vex-launcher" >> "$GITHUB_ENV"

      - name: Build app bundle and .dmg
        shell: bash
        env:
          APPLE_DEVELOPER_ID_CERT: ${{ secrets.APPLE_DEVELOPER_ID_CERT }}
          APPLE_NOTARYTOOL_KEY: ${{ secrets.APPLE_NOTARYTOOL_KEY }}
          APPLE_NOTARYTOOL_KEY_ID: ${{ secrets.APPLE_NOTARYTOOL_KEY_ID }}
          APPLE_NOTARYTOOL_ISSUER: ${{ secrets.APPLE_NOTARYTOOL_ISSUER }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"

          if [[ -n "${APPLE_NOTARYTOOL_KEY:-}" ]] && [[ ! -f "${APPLE_NOTARYTOOL_KEY}" ]]; then
            key_file="${RUNNER_TEMP}/apple-notarytool-key-${TARGET}.p8"
            printf '%s' "${APPLE_NOTARYTOOL_KEY}" > "${key_file}"
            chmod 600 "${key_file}"
            export APPLE_NOTARYTOOL_KEY="${key_file}"
          fi

          bash packaging/macos/build-app.sh \
            "${VEX_BIN}" \
            "${LAUNCHER_BIN}" \
            "${TAG}"

      - name: Rename .dmg with target suffix
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          SRC="dist/vex-${TAG}-macos.dmg"
          DST="dist/vex-${TAG}-${TARGET}.dmg"
          mv "${SRC}" "${DST}"
          shasum -a 256 "${DST}" > "${DST}.sha256"

      - name: Upload .dmg artifact
        uses: actions/upload-artifact@v6
        with:
          name: dist-dmg-${{ matrix.target }}
          path: |
            dist/*.dmg
            dist/*.dmg.sha256
          if-no-files-found: error

  sign:
    name: sign artifacts
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, macos-pkg]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign artifacts with cosign (Phase 1)
        shell: bash
        run: |
          set -euo pipefail
          # Sign compressed archives (.tar.gz, .zip) and macOS disk images (.dmg).
          for f in dist/*.tar.gz dist/*.zip dist/*.dmg; do
            [ -f "$f" ] || continue
            cosign sign-blob "$f" \
              --bundle "${f}.sigstore.json" \
              --yes
          done

      # Phase 2: SignPath.io OSS CA signing for Windows artifacts.
      # Uncomment after SignPath approval and secret provisioning.
      #
      # - name: Sign Windows zip with SignPath (Phase 2)
      #   uses: signpath/github-action-submit-signing-request@v1
      #   with:
      #     api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
      #     organization-id: "<your-org-id>"
      #     project-slug: "vexcoder"
      #     signing-policy-slug: "release-signing"
      #     artifact-configuration-slug: "windows-zip"
      #     github-artifact-id: "dist-x86_64-pc-windows-msvc"
      #     output-artifact-directory: dist
      #     wait-for-completion: true

      # Phase 3: EV Authenticode signing for Windows distribution.
      # Uncomment after provisioning an EV certificate and repository secrets.
      #
      # - name: Sign vex.exe with Authenticode (Phase 3)
      #   shell: pwsh
      #   run: |
      #     $certBytes = [Convert]::FromBase64String($env:CERT_PFX_B64)
      #     $certPath = "$env:TEMP\codesign.pfx"
      #     [IO.File]::WriteAllBytes($certPath, $certBytes)
      #     $pfxPass = ConvertTo-SecureString $env:CERT_PASSWORD -AsPlainText -Force
      #     $cert = Get-PfxCertificate -FilePath $certPath -Password $pfxPass
      #     Set-AuthenticodeSignature `
      #       -FilePath dist\vex.exe `
      #       -Certificate $cert `
      #       -TimestampServer "http://timestamp.digicert.com" `
      #       -HashAlgorithm SHA256
      #   env:
      #     CERT_PFX_B64: ${{ secrets.WINDOWS_CERT_PFX }}
      #     CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}

      - name: Upload signed artifacts
        uses: actions/upload-artifact@v6
        with:
          name: dist-signed
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/*.tar.gz.sigstore.json
            dist/*.zip
            dist/*.zip.sha256
            dist/*.zip.sigstore.json
            dist/*.dmg
            dist/*.dmg.sha256
            dist/*.dmg.sigstore.json
          if-no-files-found: error

  release:
    name: publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: sign
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download signed artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist-signed
          path: dist

      - name: Generate release notes and changelog
        id: metadata
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python3 scripts/generate_release_notes.py \
            "${TAG}" \
            dist/release-notes.md \
            "dist/CHANGELOG-${TAG}.md"
          if [[ "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-.+ ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          elif [[ "${TAG}" =~ ^[0-9a-f]{7}$ ]] || [[ "${TAG}" == "nightly" ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: List dist contents
        shell: bash
        run: ls -lh dist/

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ steps.metadata.outputs.prerelease }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          changelog="dist/CHANGELOG-${TAG}.md"
          if [[ ! -f "${changelog}" ]]; then
            echo "FAIL: expected changelog asset not found: ${changelog}" >&2
            exit 1
          fi

          files=(
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/*.tar.gz.sigstore.json
            dist/*.zip
            dist/*.zip.sha256
            dist/*.zip.sigstore.json
            dist/*.dmg
            dist/*.dmg.sha256
            dist/*.dmg.sigstore.json
          )
          files+=("${changelog}")

          if [[ ${#files[@]} -eq 0 ]]; then
            echo "FAIL: no release assets found in dist/" >&2
            exit 1
          fi

          prerelease_flag=()
          if [[ "${PRERELEASE}" == "true" ]]; then
            prerelease_flag+=(--prerelease)
          fi

          recreate_release="false"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            existing_release_is_immutable="$(gh release view "${TAG}" --json isImmutable --jq '.isImmutable')"
            if [[ "${existing_release_is_immutable}" == "true" ]]; then
              if [[ "${TAG}" == "nightly" ]]; then
                echo "Nightly release ${TAG} is immutable; deleting release so it can be recreated for the refreshed channel git tag."
                gh release delete "${TAG}" --yes
                recreate_release="true"
              else
                mapfile -t expected_assets < <(for file in "${files[@]}"; do basename "${file}"; done | sort -u)
                mapfile -t existing_assets < <(gh release view "${TAG}" --json assets --jq '.assets[].name' | sort -u)
                missing_assets="$(comm -23 <(printf '%s\n' "${expected_assets[@]}") <(printf '%s\n' "${existing_assets[@]}"))"
                if [[ -z "${missing_assets}" ]]; then
                  echo "Release ${TAG} already contains every expected asset; nothing to upload."
                  exit 0
                fi
                echo "FAIL: immutable release is missing expected assets: ${missing_assets//$'\n'/, }" >&2
                exit 1
              fi
            fi
            if [[ "${recreate_release}" != "true" ]]; then
              gh release edit "${TAG}" \
                --title "${TAG}" \
                "${prerelease_flag[@]}" \
                --notes-file dist/release-notes.md
              gh release upload "${TAG}" "${files[@]}" --clobber
              exit 0
            fi
          fi

          verify_flag=()
          if [[ "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            verify_flag+=(--verify-tag)
          fi
          gh release create "${TAG}" \
            --title "${TAG}" \
            "${verify_flag[@]}" \
            "${prerelease_flag[@]}" \
            --notes-file dist/release-notes.md \
            "${files[@]}"
