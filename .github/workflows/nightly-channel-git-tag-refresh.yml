name: Refresh Nightly Channel Git Tag And Dispatch Release

on:
  schedule:
    # GitHub evaluates this schedule on the default branch, then provisions a runner.
    # Temporary verification slot; restore the production nightly cadence after the
    # scheduled run is observed on main.
    - cron: "30 22 * * *"

permissions:
  actions: write
  contents: write

jobs:
  nightly:
    name: refresh nightly channel git tag and dispatch release
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Configure channel git tagger identity
        shell: bash
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Derive short SHA
        id: sha
        shell: bash
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA:0:7}"
          echo "short_sha=${short_sha}" >> "$GITHUB_OUTPUT"
          echo "Short SHA: ${short_sha}"

      - name: Update nightly channel git tag
        shell: bash
        env:
          SHORT_SHA: ${{ steps.sha.outputs.short_sha }}
        run: |
          set -euo pipefail
          git tag -fa nightly -m "Nightly ${SHORT_SHA}"
          git push origin refs/tags/nightly --force

      - name: Dispatch nightly release workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          payload='{"ref":"nightly"}'
          curl --fail --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/release.yml/dispatches" \
            -d "${payload}"