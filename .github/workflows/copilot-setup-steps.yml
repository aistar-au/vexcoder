name: Hosted Agent Setup Checks

on:
  workflow_dispatch:
  push:
    paths:
      - AGENTS.md
      - CONTRIBUTING.md
      - .github/copilot-instructions.md
      - .github/agents/**
      - .github/instructions/**
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - AGENTS.md
      - CONTRIBUTING.md
      - .github/copilot-instructions.md
      - .github/agents/**
      - .github/instructions/**
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Verify hosted background sessions stay self-contained
        shell: bash
        run: |
          set -euo pipefail

          show_matches() {
            local pattern="$1"
            shift
            if command -v rg >/dev/null 2>&1; then
              rg -n -- "$pattern" "$@"
            else
              grep -nE -- "$pattern" "$@"
            fi
          }

          agent_files=()
          if [[ -d .github/agents ]]; then
            while read -r file; do
              agent_files+=("$file")
            done < <(find .github/agents -maxdepth 1 -type f -name '*.agent.md' | sort)
          fi

          hosted_files=(
            .github/copilot-instructions.md
            .github/instructions/repository.instructions.md
            "${agent_files[@]}"
          )

          if show_matches "../vexdraft/.agents/skills/|aistar-au/vexdraft|synchronized skill tree|GitHub MCP|Bootstrap private skills" "${hosted_files[@]}"; then
            echo "Hosted-session contract still references private skill bootstrap."
            exit 1
          fi

          echo "Hosted background sessions are self-contained and do not require private skill bootstrap."

      - name: Verify hosted-session guardrails stay explicit
        shell: bash
        run: |
          set -euo pipefail

          has_match() {
            local pattern="$1"
            shift
            if command -v rg >/dev/null 2>&1; then
              rg -qi -- "$pattern" "$@"
            else
              grep -qiE -- "$pattern" "$@"
            fi
          }

          show_matches() {
            local pattern="$1"
            shift
            if command -v rg >/dev/null 2>&1; then
              rg -n -- "$pattern" "$@"
            else
              grep -nE -- "$pattern" "$@"
            fi
          }

          agent_files=()
          if [[ -d .github/agents ]]; then
            while read -r file; do
              agent_files+=("$file")
            done < <(find .github/agents -maxdepth 1 -type f -name '*.agent.md' | sort)
          fi

          hosted_files=(
            .github/copilot-instructions.md
            .github/instructions/repository.instructions.md
            "${agent_files[@]}"
          )

          if ((${#agent_files[@]} > 0)); then
            if show_matches '^(disable-model-invocation|user-invocable|model):' "${agent_files[@]}"; then
              echo "Unsupported agent frontmatter keys detected in .github/agents/*.agent.md"
              exit 1
            fi
          fi

          for file in "${hosted_files[@]}"; do
            has_match "Use English only" "$file" || {
              echo "Missing English-only guardrail in $file"
              exit 1
            }
            has_match 'Do not read any .*SKILL\.md.* file' "$file" || {
              echo "Missing no-SKILL guardrail in $file"
              exit 1
            }
            has_match "text-only verification and reporting" "$file" || {
              echo "Missing text-only verification guardrail in $file"
              exit 1
            }
            has_match "screenshots, screen|pseudo-screenshots|parsed terminal snapshots|visual-surrogate" "$file" || {
              echo "Missing no-visual-artifact guardrail in $file"
              exit 1
            }
            has_match 'Do not delegate .*cargo.*cargo clippy.*subagent|Do not delegate .*cargo.*make gate-fast.*subagent' "$file" || {
              echo "Missing no-cargo-delegation guardrail in $file"
              exit 1
            }
          done

          log_tail_files=(
            AGENTS.md
            CONTRIBUTING.md
            "${hosted_files[@]}"
          )

          for file in "${log_tail_files[@]}"; do
            has_match "gh agent-task view <session-id> --log --follow" "$file" || {
              echo "Missing mandatory session log tail command in $file"
              exit 1
            }
          done

          if show_matches '^[[:space:]]+--follow[[:space:]]*\\?$' CONTRIBUTING.md; then
            echo "Hosted launch examples must use explicit gh agent-task view --log --follow instead of gh agent-task create --follow."
            exit 1
          fi

      - name: Show hosted-session contract files
        shell: bash
        run: |
          set -euo pipefail
          agent_files=()
          if [[ -d .github/agents ]]; then
            while read -r file; do
              agent_files+=("$file")
            done < <(find .github/agents -maxdepth 1 -type f -name '*.agent.md' | sort)
          fi

          printf '%s\n' \
            AGENTS.md \
            CONTRIBUTING.md \
            .github/copilot-instructions.md \
            .github/instructions/repository.instructions.md

          if ((${#agent_files[@]} > 0)); then
            printf '%s\n' "${agent_files[@]}"
          fi
