
[graph]
all-features = false
no-default-features = false

[advisories]
version = 2
db-path = "$CARGO_HOME/advisory-dbs"
db-urls = ["https://github.com/rustsec/advisory-db"]

unmaintained = "all"

yanked = "deny"

unused-ignored-advisory = "warn"


[[advisories.ignore]]
id = "RUSTSEC-2025-0141"
reason = "bincode 1.3.3 is unmaintained (team ceased development after harassment incident); pulled in transitively via syntect v5.3.0 for syntax highlighting. No security vulnerability; team considers 1.3.3 a complete and stable release. Resolution: remove when syntect upgrades to bincode 2.x or an alternative."

[[advisories.ignore]]
id = "RUSTSEC-2025-0057"
reason = "fxhash 0.2.1 is unmaintained; pulled in transitively via bm25 v2.3.2. No security vulnerability; fxhash is a pure-algorithmic hash utility with no external inputs. Resolution: remove when bm25 switches to rustc-hash or an equivalent maintained crate."

[[advisories.ignore]]
id = "RUSTSEC-2025-0119"
reason = "number_prefix 0.4.0 is unmaintained; pulled in transitively via indicatif v0.17.11 for human-readable progress display. No security vulnerability; number_prefix is a display-only formatting utility. Resolution: remove when indicatif upgrades its dependency."

[[advisories.ignore]]
id = "RUSTSEC-2024-0320"
reason = "yaml-rust 0.4.5 is unmaintained; pulled in transitively via syntect v5.3.0 for TextMate grammar parsing. No security vulnerability; syntect uses it to parse read-only bundled grammar files, not user-supplied YAML. Resolution: remove when syntect switches to yaml-rust2."

[[advisories.ignore]]
id = "RUSTSEC-2025-0012"
reason = "backoff 0.4.0 is intentionally used for bounded local-startup connection retries on the CLI API transport path. The retry scope is local connect failures before any streaming response exists, and the dependency is not exposed across trust boundaries. Resolution: remove this exception when the requested retry lane migrates to a maintained equivalent such as backon without widening the transport surface."

[[advisories.ignore]]
id = "RUSTSEC-2024-0384"
reason = "instant 0.1.13 is pulled transitively by backoff 0.4.0 for the same local-startup retry path. The crate is not used directly by this repository. Resolution: remove this exception when the bounded retry implementation moves off backoff and instant leaves the graph."

[bans]
multiple-versions = "allow"

wildcards = "deny"

allow-wildcard-paths = true

allow = []

deny = []

skip = []

[licenses]
version = 2

allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CDLA-Permissive-2.0",
  "ISC",
  "MPL-2.0",
  "Unicode-3.0",
  "CC0-1.0",
  "Zlib",
  "0BSD",
  "Unlicense",
  "BSL-1.0",
  "MIT-0",
]

exceptions = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"

required-git-spec = "rev"

allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
