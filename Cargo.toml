[package]
name = "vexcoder"
version = "0.1.0-rc.9"
edition = "2021"
license = "MIT"
autobins = false

[[bin]]
name = "vex"
path = "src/bin/vex.rs"

[dependencies]
aho-corasick = "1"
anyhow = "1"
axum = { version = "0.8", features = ["http1", "json", "tokio"] }
clap = { version = "4", features = ["derive"] }
clap_complete = { version = "4" }
bytes = "1"
crossterm = { version = "0.28", features = ["bracketed-paste", "event-stream"] }
fs2 = "0.4"
futures = "0.3"
hyper = { version = "1", features = ["http1", "server"] }
http = "1"
hyper-util = { version = "0.1", features = [
  "http1",
  "server-auto",
  "service",
  "tokio",
] }
ratatui = { version = "0.29", features = [
  "unstable-rendered-line-info",
  "unstable-widget-ref",
] }
reqwest = { version = "0.13", default-features = false, features = [
  "json",
  "stream",
  "rustls",
] }
rmcp = { version = "1.2.0", default-features = false, features = [
  "client",
  "reqwest",
  "transport-child-process",
  "transport-streamable-http-client-reqwest",
] }
rustls = { version = "0.23", default-features = false, features = [
  "ring",
  "std",
  "tls12",
] }
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-rustls = "0.26"
tokio-stream = "0.1"
tokio-util = "0.7"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = [
  "env-filter",
  "fmt",
] }
unicode-segmentation = "1"
unicode-width = "0.2"
uuid = { version = "1", features = ["v4"] }
portable-pty = "0.9"
tempfile = "3"
quick-xml = "0.37"
textwrap = "0.16"
tree-sitter = "0.24"
tree-sitter-rust = "0.23"
x509-parser = "0.17"
ansi-to-tui = "7"
arboard = { version = "3", default-features = false }

[dev-dependencies]
filetime = "0.2"
insta = "1.38"
strip-ansi-escapes = "0.2"
tower = "0.5"
