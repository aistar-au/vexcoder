[package]
name = "vexcoder"
version = "0.1.0-rc.9"
edition = "2021"
license = "MIT"
autobins = false

[[bin]]
name = "vex"
path = "src/bin/vex.rs"

[dependencies]
aho-corasick = "1"
anyhow = "1"
axum = { version = "0.8", features = ["http1", "json", "tokio"] }
clap = { version = "4", features = ["derive"] }
clap_complete = { version = "4" }
bytes = "1"
crossterm = { version = "0.28", features = ["bracketed-paste", "event-stream"] }
fs2 = "0.4"
futures = "0.3"
hyper = { version = "1", features = ["http1", "server"] }
http = "1"
hyper-util = { version = "0.1", features = [
  "http1",
  "server-auto",
  "service",
  "tokio",
] }
ratatui = { version = "0.29", features = [
  "unstable-backend-writer",
  "unstable-rendered-line-info",
  "unstable-widget-ref",
] }
reqwest = { version = "0.13", default-features = false, features = [
  "json",
  "stream",
  "rustls",
] }
rmcp = { version = "1.2.0", default-features = false, features = [
  "client",
  "reqwest",
  "transport-child-process",
  "transport-streamable-http-client-reqwest",
] }
rustls = { version = "0.23", default-features = false, features = [
  "ring",
  "std",
  "tls12",
] }
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-rustls = "0.26"
tokio-stream = "0.1"
tokio-util = "0.7"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = [
  "env-filter",
  "fmt",
] }
unicode-segmentation = "1"
unicode-width = "0.2"
uuid = { version = "1", features = ["v4"] }
portable-pty = "0.9"
tempfile = "3"
quick-xml = "0.37"
textwrap = "0.16"
tree-sitter = "0.24"
tree-sitter-rust = "0.23"
x509-parser = "0.17"
ansi-to-tui = "7"
# arboard: used by the /copy slash command (src/app/commands/session.rs) for
# system clipboard access. default-features = false avoids pulling in the
# image feature and its heavy transitive deps.
arboard = { version = "3", default-features = false }

# --- Tier 1: Drop-in diagnostics, paths, diff rendering ---
color-eyre = "0.6"
dirs = "6"
tracing-appender = "0.2"
similar = "2"

# --- Tier 2: Rich rendering, macros, progress ---
ratatui-macros = "0.6"
pulldown-cmark = { version = "0.12", default-features = false }
syntect = { version = "5", default-features = false, features = [
  "default-fancy",
] }
indicatif = "0.17"
console = "0.15"

# --- Tier 3: Workspace ignore, path normalization, explicit transitive ---
ignore = "0.4"
globset = "0.4"
pathdiff = "0.2"
dunce = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

# --- Tier 4: Ordered collections, HTTP middleware, lightweight regex ---
indexmap = { version = "2", features = ["serde"] }
tower-http = { version = "0.6", default-features = false, features = ["trace"] }
regex-lite = "0.1"

# --- Tier 5: Crate expansion batch (next-batch crates now wired) ---
# which: locates executables on PATH; used by git_rollup.rs for a clear error
#        when the `git` binary is absent.
which = { version = "7", default-features = false }
# bm25: text-ranking layer for codebase_search; sits behind the aho-corasick
#       literal-match scoring to add term-frequency weighting.
bm25 = "2"
# notify: filesystem event watching; used by git_rollup.rs watch mode to
#         detect working-tree changes without polling.
notify = { version = "8", default-features = false, features = ["macos_kqueue"] }

[dev-dependencies]
filetime = "0.2"
insta = "1.38"
strip-ansi-escapes = "0.2"
tower = "0.5"
pretty_assertions = "1"
assert_cmd = "2"
