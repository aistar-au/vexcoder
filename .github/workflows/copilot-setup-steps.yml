name: Copilot Setup Steps

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Verify hosted background sessions stay self-contained
        shell: bash
        run: |
          set -euo pipefail

          hosted_files=(
            .github/copilot-instructions.md
            .github/agents/vexcoder-ui-parity-orchestrator.agent.md
            .github/agents/vexcoder-ui-paragraph-renderer.agent.md
          )

          if rg -n "../vexdraft/.agents/skills/|aistar-au/vexdraft|synchronized skill tree|GitHub MCP|Bootstrap private skills" "${hosted_files[@]}"; then
            echo "Hosted-session contract still references private skill bootstrap."
            exit 1
          fi

          echo "Hosted background sessions are self-contained and do not require private skill bootstrap."

      - name: Show hosted-session contract files
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' \
            AGENTS.md \
            CONTRIBUTING.md \
            .github/copilot-instructions.md \
            .github/instructions/repository.instructions.md \
            .github/agents/vexcoder-ui-parity-orchestrator.agent.md \
            .github/agents/vexcoder-ui-paragraph-renderer.agent.md
