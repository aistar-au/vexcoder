name: docs-build

on:
  pull_request:
    paths:
      - "docs/**"
      - "book.toml"
      - ".github/workflows/docs-build.yml"
      - ".github/workflows/docs-build-and-deploy.yml"

permissions:
  contents: read

concurrency:
  group: docs-build-pr
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install mdBook
        run: |
          set -euo pipefail
          MDBOOK_VERSION="v0.4.40"
          curl -sSL \
            "https://github.com/rust-lang/mdBook/releases/download/${MDBOOK_VERSION}/mdbook-${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz --directory=/usr/local/bin mdbook

      - name: Build docs
        run: mdbook build
