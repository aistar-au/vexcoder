name: docs-build

on:
  pull_request:
    paths:
      - "docs/**"
      - "book.toml"
      - ".github/workflows/docs-build.yml"
      - ".github/workflows/docs-build-and-deploy.yml"

permissions:
  contents: read

concurrency:
  group: docs-build-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        env:
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          AUTH="$(printf 'x-access-token:%s' "$TOKEN" | base64 | tr -d '\n')"
          git init .
          git remote add origin "https://github.com/${REPO}.git"
          git -c http.extraheader="AUTHORIZATION: basic ${AUTH}" fetch --depth=1 origin "$SHA"
          git checkout --detach FETCH_HEAD

      - name: Install stable Rust
        run: |
          set -euo pipefail
          source "$HOME/.cargo/env" 2>/dev/null || true
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install mdBook 0.4.40
        run: cargo install mdbook --version 0.4.40 --locked

      - name: Build docs
        run: mdbook build
