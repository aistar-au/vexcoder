name: Nightly Snapshot Release

on:
  schedule:
    # GitHub's server-side scheduler evaluates cron expressions on the default
    # branch and provisions a runner when the time fires.  Runs may be delayed
    # up to ~30 minutes during high-load windows.
    #
    # Temporary proof slot: 22:30 UTC on 2026-04-07 for immediate verification.
    # Revert to daily cadence (03:00 UTC) once this run is confirmed green.
    - cron: "30 22 * * *"
  workflow_dispatch: # Manual trigger for testing and one-off nightly snapshots.

permissions:
  contents: write

jobs:
  snapshot:
    name: create nightly snapshot tag
    runs-on: ubuntu-24.04

    steps:
      - name: Validate snapshot auth token
        shell: bash
        env:
          SNAPSHOT_TOKEN: ${{ secrets.NIGHTLY_CHANNEL_GIT_TAG_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${SNAPSHOT_TOKEN}" ]]; then
            echo "::error::NIGHTLY_CHANNEL_GIT_TAG_TOKEN secret is required to push snapshot tags and trigger the release workflow."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          # PAT (not github.token) so the tag push triggers the release workflow.
          token: ${{ secrets.NIGHTLY_CHANNEL_GIT_TAG_TOKEN }}
          fetch-depth: 0

      - name: Configure git tagger identity
        shell: bash
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create snapshot tag if needed
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA:0:7}"
          echo "short_sha=${short_sha}" >> "$GITHUB_OUTPUT"

          if git ls-remote --tags origin | grep -qw "refs/tags/${short_sha}"; then
            echo "::notice::Snapshot tag ${short_sha} already exists — nightly release is current."
            echo "created=false" >> "$GITHUB_OUTPUT"
          else
            git tag -a "${short_sha}" -m "Nightly snapshot ${short_sha}"
            git push origin "${short_sha}"
            echo "::notice::Created and pushed snapshot tag ${short_sha}."
            echo "created=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Summary
        shell: bash
        env:
          SHORT_SHA: ${{ steps.tag.outputs.short_sha }}
          CREATED: ${{ steps.tag.outputs.created }}
        run: |
          echo "## Nightly Snapshot" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Commit:** \`${SHORT_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          if [[ "${CREATED}" == "true" ]]; then
            echo "- **Tag:** created \`${SHORT_SHA}\` — release workflow triggered" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- **Tag:** \`${SHORT_SHA}\` already exists — skipped" >> "$GITHUB_STEP_SUMMARY"
          fi
