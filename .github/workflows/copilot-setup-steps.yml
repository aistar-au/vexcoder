name: Copilot Setup Steps

on:
  workflow_dispatch:
  push:
    paths:
      - AGENTS.md
      - CONTRIBUTING.md
      - .github/copilot-instructions.md
      - .github/agents/**
      - .github/instructions/**
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - AGENTS.md
      - CONTRIBUTING.md
      - .github/copilot-instructions.md
      - .github/agents/**
      - .github/instructions/**
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Verify hosted background sessions stay self-contained
        shell: bash
        run: |
          set -euo pipefail

          hosted_files=(
            .github/copilot-instructions.md
            .github/agents/rust-change-auditor.agent.md
            .github/agents/vexcoder-ui-parity-orchestrator.agent.md
            .github/agents/vexcoder-ui-paragraph-renderer.agent.md
            .github/agents/vexcoder-transcript-renderer-overhaul.agent.md
          )

          if rg -n "../vexdraft/.agents/skills/|aistar-au/vexdraft|synchronized skill tree|GitHub MCP|Bootstrap private skills" "${hosted_files[@]}"; then
            echo "Hosted-session contract still references private skill bootstrap."
            exit 1
          fi

          echo "Hosted background sessions are self-contained and do not require private skill bootstrap."

      - name: Verify hosted-session guardrails stay explicit
        shell: bash
        run: |
          set -euo pipefail

          hosted_files=(
            .github/copilot-instructions.md
            .github/agents/rust-change-auditor.agent.md
            .github/agents/vexcoder-ui-parity-orchestrator.agent.md
            .github/agents/vexcoder-ui-paragraph-renderer.agent.md
            .github/agents/vexcoder-transcript-renderer-overhaul.agent.md
          )

          for file in "${hosted_files[@]}"; do
            rg -q "Use English only" "$file" || {
              echo "Missing English-only guardrail in $file"
              exit 1
            }
            rg -q 'Do not read any `SKILL.md` file' "$file" || {
              echo "Missing no-SKILL guardrail in $file"
              exit 1
            }
            rg -q "text-only verification and reporting" "$file" || {
              echo "Missing text-only verification guardrail in $file"
              exit 1
            }
            rg -q "screenshots, screen|pseudo-screenshots|parsed terminal snapshots|visual-surrogate" "$file" || {
              echo "Missing no-visual-artifact guardrail in $file"
              exit 1
            }
          done

          dispatcher_files=(
            AGENTS.md
            CONTRIBUTING.md
            .github/instructions/repository.instructions.md
          )

          for file in "${dispatcher_files[@]}"; do
            rg -q "gh agent-task view <session-id> --log --follow" "$file" || {
              echo "Missing mandatory session log tail command in $file"
              exit 1
            }
          done

          if rg -n '^[[:space:]]+--follow[[:space:]]*\\?$' CONTRIBUTING.md; then
            echo "Hosted launch examples must use explicit gh agent-task view --log --follow instead of gh agent-task create --follow."
            exit 1
          fi

      - name: Show hosted-session contract files
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' \
            AGENTS.md \
            CONTRIBUTING.md \
            .github/copilot-instructions.md \
            .github/agents/rust-change-auditor.agent.md \
            .github/instructions/repository.instructions.md \
            .github/agents/vexcoder-ui-parity-orchestrator.agent.md \
            .github/agents/vexcoder-ui-paragraph-renderer.agent.md \
            .github/agents/vexcoder-transcript-renderer-overhaul.agent.md
