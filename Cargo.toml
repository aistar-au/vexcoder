[workspace]
members = [".", "crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0-rc.9"
edition = "2024"
rust-version = "1.91"
license = "MIT"

[workspace.dependencies]
crossterm = { version = "0.29", features = ["bracketed-paste", "event-stream"] }
ratatui = { version = "0.30", features = [
  "scrolling-regions",
  "unstable-backend-writer",
  "unstable-rendered-line-info",
  "unstable-widget-ref",
  "crossterm_0_29",
] }
ansi-to-tui = "8"
ratatui-macros = "0.7"
aho-corasick = "1"
anyhow = "1"
axum = { version = "0.8", features = ["http1", "http2", "json", "tokio"] }
axum-tracing-opentelemetry = "0.33"
clap = { version = "4", features = ["derive"] }
clap_complete = { version = "4" }
bytes = "1"
eventsource-client = { version = "0.17", default-features = false }
backoff = { version = "0.4", default-features = false, features = ["tokio"] }
fs2 = "0.4"
futures = "0.3"
hyper = { version = "1", features = ["http1", "http2", "server"] }
http = "1"
http-api-problem = { version = "0.60", default-features = false, features = [
  "axum",
] }
hyper-util = { version = "0.1", features = [
  "http1",
  "http2",
  "server-auto",
  "service",
  "tokio",
] }
reqwest = { version = "0.13", default-features = false, features = [
  "json",
  "http2",
  "multipart",
  "stream",
  "rustls",
  "socks",
] }
async-compression = { version = "0.4", default-features = false, features = [
  "tokio",
  "gzip",
  "brotli",
  "zlib",
] }
jsonwebtoken = "9"
oauth2 = { version = "4", default-features = false }
open = "5"
hickory-resolver = { version = "0.26", default-features = false, features = [
  "https-ring",
  "tokio",
] }
rmcp = { version = "1.2.0", default-features = false, features = [
  "client",
  "reqwest",
  "transport-child-process",
  "transport-streamable-http-client-reqwest",
] }
rustls = { version = "0.23", default-features = false, features = [
  "ring",
  "std",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-rustls = "0.26"
tokio-stream = "0.1"
tokio-util = "0.7"
toml = "0.8"
opentelemetry = { version = "0.31", default-features = false, features = [
  "trace",
] }
opentelemetry-semantic-conventions = "0.31"
opentelemetry_sdk = { version = "0.31", default-features = false, features = [
  "trace",
] }
tracing = "0.1"
tracing-opentelemetry = { version = "0.32", default-features = false }
tracing-subscriber = { version = "0.3", default-features = false, features = [
  "env-filter",
  "fmt",
  "json",
] }
unicode-segmentation = "1"
unicode-width = "0.2"
uuid = { version = "1", features = ["v4"] }
portable-pty = "0.9"
tempfile = "3"
textwrap = "0.16"
tree-sitter = "0.26"
tree-sitter-rust = "0.24"
x509-parser = "0.18"
arboard = { version = "3", default-features = false }
color-eyre = "0.6"
human-panic = "2"
dialoguer = "0.12"
dirs = "6"
tracing-appender = "0.2"
similar = "2"
pulldown-cmark = { version = "0.13", default-features = false }
palette = "0.7"
syntect = { version = "5", default-features = false, features = [
  "default-fancy",
] }
indicatif = "0.17"
console = "0.15"
tabled = "0.20"
ignore = "0.4"
globset = "0.4"
pathdiff = "0.2"
dunce = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
indexmap = { version = "2", features = ["serde"] }
tower-http = { version = "0.6", default-features = false, features = [
  "request-id",
  "sensitive-headers",
  "trace",
] }
tower_governor = { version = "0.8", default-features = false, features = [
  "axum",
  "tracing",
] }
regex-lite = "0.1"
httpdate = "1"
which = { version = "7", default-features = false }
bm25 = "2"
notify = { version = "8", default-features = false, features = [
  "macos_kqueue",
] }
git2 = { version = "0.20", default-features = false, features = [
  "vendored-libgit2",
] }
gix = { version = "0.81", default-features = false, features = ["sha1"] }
gix-discover = "0.49"
gix-config = "0.54"
gix-index = "0.49"
imara-diff = { version = "0.2", features = ["unified_diff"] }
keyring = { version = "3", features = [
  "apple-native",
  "windows-native",
  "linux-native",
] }
launchdarkly-sdk-transport = { version = "0.1", default-features = false }
grep-matcher = "0.1"
grep-regex = "0.1"
grep-searcher = "0.1"
memmap2 = "0.9"
bstr = "1"
rayon = "1"
crossbeam-channel = "0.5"
tree-sitter-python = "0.25"
tree-sitter-typescript = "0.23.2"
tree-sitter-javascript = "0.25"
filetime = "0.2"
insta = "1.38"
strip-ansi-escapes = "0.2"
tower = "0.5"
pretty_assertions = "1"
assert_cmd = "2"
rstest = "0.26"

[workspace.metadata.upgrade-seams]
ratatui = ["src/ui/tui.rs", "src/tui_handle.rs"]
crossterm = [
  "src/ui/tui.rs",
  "src/tui_frontend.rs",
  "src/ui/editor/mod.rs",
  "src/app.rs",
  "src/app/overlay.rs",
  "src/app/tests/mod.rs",
]
async-compression = ["src/net/compression.rs"]
jsonwebtoken = ["src/net/jwt.rs"]
oauth2 = ["src/net/oauth.rs"]
open = ["src/net/oauth.rs"]
rmcp = ["src/mcp.rs"]
http = [
  "src/http_facade.rs",
  "src/mcp.rs",
  "src/server/http.rs",
  "src/server/util.rs",
  "src/server/handlers/mod.rs",
  "src/server/handlers/session.rs",
  "src/server/tests.rs",
]
tokio = [
  "src/runtime/tokio.rs",
  "src/app.rs",
  "src/local_api.rs",
  "src/mcp.rs",
  "src/server.rs",
  "src/server/http.rs",
  "src/server/handlers/mod.rs",
  "src/server/handlers/session.rs",
  "src/test_support.rs",
  "src/pr_summary.rs",
  "src/batch_mode.rs",
  "src/state/conversation/streaming.rs",
  "src/app/pulse_start.rs",
]
serde = [
  "derive and #[serde(...)] attributes stay next to their types in src/** and crates/vexcoder-api-types/src/lib.rs",
]
arboard = ["src/clipboard.rs", "src/app/commands/session.rs"]
pulldown-cmark = ["src/ui/render/markdown.rs"]
palette = ["src/ui/render/markdown.rs"]
syntect = ["src/ui/render/markdown.rs"]
human-panic = ["src/bin/vex.rs"]
dialoguer = ["src/bin/vex.rs"]
tabled = ["src/bin/vex.rs"]
ansi-to-tui = ["src/ui/tui.rs"]
hickory-resolver = ["src/net/dns.rs"]
reqwest = [
  "src/api/client/mod.rs",
  "src/mcp.rs",
  "src/net/http_client.rs",
  "src/server/http.rs",
  "src/server/util.rs",
  "src/server/handlers/mod.rs",
  "src/server/handlers/session.rs",
  "src/net/proxy.rs",
]
axum-tracing-opentelemetry = ["src/server/http.rs"]
backoff = ["src/api/eventsource.rs"]
http-api-problem = ["src/server/util.rs"]
opentelemetry = ["src/observability.rs", "src/api/client/mod.rs"]
opentelemetry-semantic-conventions = [
  "src/api/client/mod.rs",
  "src/runtime/json_handoff/protocol_ingress.rs",
]
opentelemetry_sdk = ["src/observability.rs"]
tower-http = ["src/server/http.rs", "src/observability.rs"]
tower_governor = ["src/server/http.rs"]
tracing-opentelemetry = ["src/observability.rs", "src/api/client/mod.rs"]
tree-sitter = ["src/tools/index.rs"]
tree-sitter-rust = ["src/tools/index.rs"]
tree-sitter-python = ["src/tools/index.rs"]
tree-sitter-typescript = ["src/tools/index.rs"]
tree-sitter-javascript = ["src/tools/index.rs"]
gix = ["src/runtime/git_rollup.rs"]
gix-discover = ["src/runtime/git_rollup.rs"]
gix-config = ["src/runtime/git_rollup.rs"]
gix-index = ["src/runtime/git_rollup.rs"]
git2 = ["src/tools/operator/git_ops.rs"]

[workspace.metadata.upgrade-notes]
rust = "Update workspace.package.rust-version and CI toolchain declarations together; also update clippy.toml msrv field."
serde = "Derive and field/container attributes are compile-time only; a facade does not reduce churn here."
tokio = "Runtime helpers are localized in src/runtime/tokio.rs; attribute macros like #[tokio::test] remain direct in tests and binaries."
tree-sitter = "All five grammar crates share the same seam (src/tools/index.rs); bump them together."
gix = "The four gix-* sub-crates share the same seam (src/runtime/git_rollup.rs); coordinate their bumps."
pulldown-cmark = "pulldown-cmark and syntect share src/ui/render/markdown.rs; check both when either changes."
palette = "Semantic markdown accent derivation stays localized in src/ui/render/markdown.rs."
async-compression = "Compression and decompression wiring stays localized in src/net/compression.rs, including output-cap enforcement."
hickory-resolver = "DoH resolver configuration and rustls-dependent DNS wiring stay localized in src/net/dns.rs."
jsonwebtoken = "JWT/JWS helpers stay localized in src/net/jwt.rs; keep RFC 7519 audience parsing and expiry semantics aligned when upgrading."
oauth2 = "Native-app PKCE generation, authorization URL assembly, and the custom async token-exchange adapter stay localized in src/net/oauth.rs."
open = "Browser-launch helpers for RFC 8252 native-app authorization stay localized in src/net/oauth.rs."
reqwest = "Core HTTP client seams remain in src/api/client/mod.rs, src/net/http_client.rs, and src/server/, with proxy-specific URL handling isolated in src/net/proxy.rs."
human-panic = "The release-build panic path stays localized in src/bin/vex.rs so panic-hook ownership remains explicit alongside color-eyre's eyre hook."
dialoguer = "Interactive credential-secret entry stays localized in src/bin/vex.rs; keep hidden TTY prompts on the CLI credential path only."
tabled = "Interactive task-list rendering stays localized in src/bin/vex.rs; non-TTY and --json output remain separate compatibility paths."

