name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # Signing phases:
  #   Phase 1 (now): Sigstore cosign keyless signatures with OIDC-backed bundles.
  #   Phase 2 (future): SignPath.io OSS Authenticode signing for Windows artifacts.
  #   Phase 3 (future): EV Authenticode signing for end-user Windows distribution.
  build:
    name: package (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
            build_tool: cross
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04
            build_tool: cross
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            build_tool: cargo
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            build_tool: cargo
          - target: aarch64-apple-darwin
            runner: macos-15
            build_tool: cargo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.build_tool == 'cross'
        shell: bash
        run: cargo install cross --locked

      - name: Install ripgrep (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep

      - name: Install ripgrep (macOS)
        if: runner.os == 'macOS'
        run: brew install ripgrep

      - name: Install Taplo (non-Windows)
        if: runner.os != 'Windows'
        shell: bash
        run: cargo install taplo-cli --version 0.8.1 --locked

      - name: Install cargo-nextest (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: cargo install cargo-nextest --version 0.9.132 --locked

      - name: Install cargo-nextest (macOS prebuilt)
        if: runner.os == 'macOS'
        shell: bash
        env:
          NEXTEST_VERSION: 0.9.132
        run: |
          set -euo pipefail
          bin_dir="${CARGO_HOME:-$HOME/.cargo}/bin"
          mkdir -p "${bin_dir}"
          curl -LsSf "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-${NEXTEST_VERSION}/cargo-nextest-${NEXTEST_VERSION}-universal-apple-darwin.tar.gz" \
            | tar -xzf - -C "${bin_dir}" cargo-nextest
          chmod +x "${bin_dir}/cargo-nextest"

      - name: Verify tag matches Cargo package version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          set -euo pipefail
          pkgid="$(cargo pkgid --quiet)"
          pkg_fragment="${pkgid##*#}"
          expected_tag="v${pkg_fragment##*@}"
          if [[ "${GITHUB_REF_NAME}" != "${expected_tag}" ]]; then
            echo "FAIL: Git tag ${GITHUB_REF_NAME} does not match Cargo package tag ${expected_tag}" >&2
            exit 1
          fi

      - name: Run gate (non-Windows)
        if: runner.os != 'Windows'
        shell: bash
        run: make gate-fast

      - name: Package release archive (non-Windows)
        if: runner.os != 'Windows'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          OUT_DIR: dist
          BUILD_TOOL: ${{ matrix.build_tool }}
        run: bash scripts/release.sh

      - name: Package release archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
          OUT_DIR: dist
        run: |
          .\scripts\release.ps1 -Target $env:TARGET -OutDir $env:OUT_DIR

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  sign:
    name: sign artifacts
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign artifacts with cosign (Phase 1)
        shell: bash
        run: |
          set -euo pipefail
          for f in dist/*.tar.gz dist/*.zip; do
            [ -f "$f" ] || continue
            cosign sign-blob "$f" \
              --bundle "${f}.sigstore.json" \
              --yes
          done

      # Phase 2: SignPath.io OSS CA signing for Windows artifacts.
      # Uncomment after SignPath approval and secret provisioning.
      #
      # - name: Sign Windows zip with SignPath (Phase 2)
      #   uses: signpath/github-action-submit-signing-request@v1
      #   with:
      #     api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
      #     organization-id: "<your-org-id>"
      #     project-slug: "vexcoder"
      #     signing-policy-slug: "release-signing"
      #     artifact-configuration-slug: "windows-zip"
      #     github-artifact-id: "dist-x86_64-pc-windows-msvc"
      #     output-artifact-directory: dist
      #     wait-for-completion: true

      # Phase 3: EV Authenticode signing for Windows distribution.
      # Uncomment after provisioning an EV certificate and repository secrets.
      #
      # - name: Sign vex.exe with Authenticode (Phase 3)
      #   shell: pwsh
      #   run: |
      #     $certBytes = [Convert]::FromBase64String($env:CERT_PFX_B64)
      #     $certPath = "$env:TEMP\codesign.pfx"
      #     [IO.File]::WriteAllBytes($certPath, $certBytes)
      #     $pfxPass = ConvertTo-SecureString $env:CERT_PASSWORD -AsPlainText -Force
      #     $cert = Get-PfxCertificate -FilePath $certPath -Password $pfxPass
      #     Set-AuthenticodeSignature `
      #       -FilePath dist\vex.exe `
      #       -Certificate $cert `
      #       -TimestampServer "http://timestamp.digicert.com" `
      #       -HashAlgorithm SHA256
      #   env:
      #     CERT_PFX_B64: ${{ secrets.WINDOWS_CERT_PFX }}
      #     CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}

      - name: Upload signed artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-signed
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/*.tar.gz.sigstore.json
            dist/*.zip
            dist/*.zip.sha256
            dist/*.zip.sigstore.json
          if-no-files-found: error

  release:
    name: publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: sign
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download signed artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-signed
          path: dist

      - name: Generate release notes and changelog
        id: metadata
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python3 scripts/generate_release_notes.py \
            "${TAG}" \
            dist/release-notes.md \
            "dist/CHANGELOG-${TAG}.md"
          if [[ "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-.+ ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: List dist contents
        shell: bash
        run: ls -lh dist/

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ steps.metadata.outputs.prerelease }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          changelog="dist/CHANGELOG-${TAG}.md"
          if [[ ! -f "${changelog}" ]]; then
            echo "FAIL: expected changelog asset not found: ${changelog}" >&2
            exit 1
          fi

          files=(
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/*.tar.gz.sigstore.json
            dist/*.zip
            dist/*.zip.sha256
            dist/*.zip.sigstore.json
          )
          files+=("${changelog}")

          if [[ ${#files[@]} -eq 0 ]]; then
            echo "FAIL: no release assets found in dist/" >&2
            exit 1
          fi

          prerelease_flag=()
          if [[ "${PRERELEASE}" == "true" ]]; then
            prerelease_flag+=(--prerelease)
          fi

          if gh release view "${TAG}" >/dev/null 2>&1; then
            existing_release_is_immutable="$(gh release view "${TAG}" --json isImmutable --jq '.isImmutable')"
            if [[ "${existing_release_is_immutable}" == "true" ]]; then
              mapfile -t expected_assets < <(for file in "${files[@]}"; do basename "${file}"; done | sort -u)
              mapfile -t existing_assets < <(gh release view "${TAG}" --json assets --jq '.assets[].name' | sort -u)
              missing_assets="$(comm -23 <(printf '%s\n' "${expected_assets[@]}") <(printf '%s\n' "${existing_assets[@]}"))"
              if [[ -z "${missing_assets}" ]]; then
                echo "Release ${TAG} already contains every expected asset; nothing to upload."
                exit 0
              fi
              echo "FAIL: immutable release is missing expected assets: ${missing_assets//$'\n'/, }" >&2
              exit 1
            fi
            gh release edit "${TAG}" \
              --title "${TAG}" \
              "${prerelease_flag[@]}" \
              --notes-file dist/release-notes.md
            gh release upload "${TAG}" "${files[@]}" --clobber
          else
            gh release create "${TAG}" \
              --title "${TAG}" \
              --verify-tag \
              "${prerelease_flag[@]}" \
              --notes-file dist/release-notes.md \
              "${files[@]}"
          fi
